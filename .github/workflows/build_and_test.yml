name: CI (build and test)

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:
  release:
    types: [published]


jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest]
    name: "Core, ${{  matrix.os }}"
    runs-on: ${{  matrix.os }}
    timeout-minutes: 30
    env:
      # CI runners have no GPU; mock the CUDA virtual package so the CUDA pytorch env installs
      CONDA_OVERRIDE_CUDA: "12"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.0
        with:
          # Same version as the Fractal server, so install behaviour matches
          pixi-version: v0.70.2
          cache: true
          environments: dev

      - name: Check if manifest has changed
        run: pixi run -e dev fractal-manifest check --package fractal_microsam_segmentation_task

      - name: Test core library with pytest
        run: pixi run -e dev pytest tests

      - name: Install default env as Fractal does (CUDA requirement stripped, frozen, no GPU)
        run: |
          sed -i '/^\[tool.pixi.system-requirements\]$/,/^cuda = /d' pyproject.toml
          ! grep -q 'system-requirements' pyproject.toml
          env -u CONDA_OVERRIDE_CUDA pixi install --frozen -e default
  
  deploy:
    name: Deploy
    needs: tests
    if: success() && startsWith(github.ref, 'refs/tags/') && github.event_name != 'schedule'
    runs-on: ubuntu-latest

    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing on PyPi
      # see https://docs.pypi.org/trusted-publishers/
      id-token: write
      # This permission allows writing releases
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 👷 Build
        run: |
          python -m pip install build
          sed -i '/^\[tool.pixi.system-requirements\]$/,/^cuda = /d' pyproject.toml
          ! grep -q 'system-requirements' pyproject.toml
          # the stripped file makes the tree dirty; pin the version to the tag instead
          SETUPTOOLS_SCM_PRETEND_VERSION="${GITHUB_REF_NAME#v}" python -m build

      - name: 🚢 Publish to PyPI
        # TODO remove the "if: false" line when the package is ready for pypi release
        if: false
        uses: pypa/gh-action-pypi-publish@release/v1

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: './dist/*'