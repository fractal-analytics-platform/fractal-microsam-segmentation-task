name: Relock
on:
  push:
    branches: [fix/cuda-lock-without-host-requirement]
jobs:
  relock:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.0
        with:
          pixi-version: v0.70.2
          run-install: false
          cache: false
      - run: CONDA_OVERRIDE_CUDA=12 pixi lock
      - uses: actions/upload-artifact@v4
        with:
          name: pixi-lock
          path: pixi.lock
